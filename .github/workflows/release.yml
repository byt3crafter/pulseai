name: Release images

# Build the gateway + dashboard images ONCE (here, on GitHub's runners) and push
# them to the PRIVATE Pulse registry on runstate when a version tag is pushed. Client
# VPSs then just `docker compose pull` from runstate — no source builds on any box,
# nothing touches GitHub. See docs/FLEET.md.
#
# Required repo secrets:
#   REGISTRY_HOST      e.g. registry.runstate.mu
#   REGISTRY_USER      the push user (e.g. pulse-ci)
#   REGISTRY_PASSWORD  its password

on:
  push:
    tags: ["v*.*.*"]

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - app: gateway
            dockerfile: ./pulse/Dockerfile
          - app: dashboard
            dockerfile: ./dashboard/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the Pulse registry (runstate)
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Image tags/labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.REGISTRY_HOST }}/pulse-${{ matrix.app }}
          # v0.19.0 → tags 0.19.0 + latest
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
