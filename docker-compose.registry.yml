# Registry overlay — makes a box PULL pre-built images from the runstate hub instead
# of compiling from source. Use it in place of building:
#
#   docker compose -f docker-compose.yml -f docker-compose.registry.yml \
#       -f docker-compose.<client>.yml pull
#   docker compose -f docker-compose.yml -f docker-compose.registry.yml \
#       -f docker-compose.<client>.yml up -d
#
# PULSE_REGISTRY + PULSE_VERSION come from the box's .env. The box must first
# `docker login ${PULSE_REGISTRY}` with the read-only pull credential. Because
# `image:` is set and we never pass `--build`, the base file's `build:` is ignored.
services:
  pulse-gateway:
    image: ${PULSE_REGISTRY:-registry.runstate.mu}/pulse-gateway:${PULSE_VERSION:-latest}
    pull_policy: always

  pulse-dashboard:
    image: ${PULSE_REGISTRY:-registry.runstate.mu}/pulse-dashboard:${PULSE_VERSION:-latest}
    pull_policy: always
