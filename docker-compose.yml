services:
  # -----------------------------------------------------------------
  # Postgres Database (Persistence)
  # -----------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:0.8.0-pg15
    container_name: pulse-postgres
    restart: always
    environment:
      POSTGRES_USER: pulseadmin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: pulse
    volumes:
      - pulse-db-data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U pulseadmin -d pulse" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # -----------------------------------------------------------------
  # Redis (Rate Limiting, Job Queue via BullMQ)
  # -----------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: pulse-redis
    restart: always
    expose:
      - "6379"
    volumes:
      - pulse-redis-data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  # -----------------------------------------------------------------
  # Fastify Gateway Service (API, Webhooks, Websockets)
  # -----------------------------------------------------------------
  pulse-gateway:
    build:
      context: .
      dockerfile: ./pulse/Dockerfile
    container_name: pulse-gateway
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8080"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=8080
      - DATABASE_URL=postgres://pulseadmin:${POSTGRES_PASSWORD}@postgres:5432/pulse
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - WORKSPACE_BASE_DIR=/app/data/workspaces
      - WEBHOOK_BASE_URL=${WEBHOOK_BASE_URL:-}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET:-}
      # Shared secret for server-to-server calls from the dashboard (e.g. Approval
      # Center Allow/Deny). Empty = those dashboard actions are disabled (fail-safe).
      - ADMIN_API_KEY=${ADMIN_API_KEY:-}
      # Codex/ChatGPT-subscription backend: auth persists in the mounted volume.
      - CODEX_HOME=/app/.codex
    volumes:
      - pulse-workspace-data:/app/data/workspaces
      - pulse-codex-home:/app/.codex
      # Docker-out-of-Docker: let the gateway spin up ephemeral sandbox containers
      # on the host daemon. The agent's code still runs in a locked-down --rm container.
      - /var/run/docker.sock:/var/run/docker.sock
    # Join the host's docker group so the non-root gateway user can use the socket.
    # Set DOCKER_GID in .env to the host's docker group id (`getent group docker`).
    group_add:
      - "${DOCKER_GID:-987}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # -----------------------------------------------------------------
  # Next.js Dashboard (Frontend Admin Panel)
  # NOTE: NEXTAUTH_URL must be changed for production (e.g. https://yourdomain.com)
  # -----------------------------------------------------------------
  pulse-dashboard:
    build:
      context: .
      dockerfile: ./dashboard/Dockerfile
    container_name: pulse-dashboard
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://pulseadmin:${POSTGRES_PASSWORD}@postgres:5432/pulse
      # Env-driven so each deployment sets its own public URL (dev default kept).
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      # Needed when the dashboard runs behind a reverse proxy (prod/HTTPS).
      - AUTH_TRUST_HOST=${AUTH_TRUST_HOST:-false}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - WORKSPACE_BASE_DIR=/app/data/workspaces
      - WEBHOOK_BASE_URL=${WEBHOOK_BASE_URL:-}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET:-}
      # Reach the gateway over the internal docker network for server-to-server
      # calls (Approval Center decisions), authed with the shared ADMIN_API_KEY.
      - PULSE_GATEWAY_URL=http://pulse-gateway:8080
      - ADMIN_API_KEY=${ADMIN_API_KEY:-}
    volumes:
      - pulse-workspace-data:/app/data/workspaces
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # -----------------------------------------------------------------
  # Python Sandbox Image (Agent Code Execution)
  # -----------------------------------------------------------------
  python-sandbox:
    build:
      context: ./pulse/docker/python-sandbox
      dockerfile: Dockerfile
    image: pulse-python-sandbox:latest
    profiles:
      - build-only

volumes:
  pulse-db-data:
  pulse-redis-data:
  pulse-workspace-data:
  pulse-codex-home:
