<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src *; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
<title>Pulse</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Login -->
  <div id="login" class="login-wrap">
    <div class="login-card">
      <div class="brand"><span class="logo">P</span><span id="brandName">Pulse</span></div>
      <p class="tagline">Your AI workforce — desktop</p>
      <div id="loginErr" class="err" hidden></div>
      <label>Email</label>
      <input id="email" type="email" autocomplete="username" placeholder="you@company.com" />
      <label>Password</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" />
      <div id="totpRow" hidden>
        <label>Authentication code</label>
        <input id="totp" type="text" inputmode="numeric" placeholder="6-digit code or recovery code" />
      </div>
      <button id="signin">Sign in</button>
      <button id="advToggle" class="link">Server settings</button>
      <div id="adv" hidden>
        <label>Gateway URL</label>
        <input id="server" type="text" placeholder="https://pulse.runstate.mu/api/gateway" />
      </div>
    </div>
    <p class="foot">Pulse Desktop <span id="ver"></span></p>
  </div>

  <!-- Assistant -->
  <div id="app" class="app-wrap" hidden>
    <aside class="rail">
      <button id="newChat" class="new-chat">+ New chat</button>
      <div id="sessionList" class="session-list"></div>
      <div class="rail-foot">
        <span id="userName" class="uname"></span>
        <button id="logout" class="link">Sign out</button>
      </div>
    </aside>
    <main class="chat">
      <header class="chat-head">
        <div id="connDot" class="conn-dot" title="Connecting…"></div>
        <select id="agentSelect" class="agent-select"></select>
      </header>
      <div id="messages" class="messages"></div>
      <div id="composer" class="composer-wrap">
        <div id="dropHint" class="drop-hint" hidden>Drop files to attach</div>
        <div id="fileChips" class="file-chips"></div>
        <textarea id="input" rows="1" placeholder="Message your assistant…  (use @Name to address an agent)"></textarea>
        <div class="composer-bar">
          <div class="flex-spacer"></div>
          <button id="attach" class="icon-btn" title="Attach files (or drag & drop)">📎</button>
          <input id="fileInput" type="file" multiple hidden />
          <button id="send" class="send-btn" title="Send">↑</button>
        </div>
      </div>
    </main>
  </div>

  <script src="vendor/marked.umd.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
