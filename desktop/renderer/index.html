<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src *; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
<title>Pulse</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Login -->
  <div id="login" class="login-wrap">
    <div class="login-card">
      <div class="brand"><span class="logo">P</span><span id="brandName">Pulse</span></div>
      <p class="tagline">Your AI workforce — desktop</p>
      <div id="loginErr" class="err" hidden></div>
      <label>Email</label>
      <input id="email" type="email" autocomplete="username" placeholder="you@company.com" />
      <label>Password</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" />
      <div id="totpRow" hidden>
        <label>Authentication code</label>
        <input id="totp" type="text" inputmode="numeric" placeholder="6-digit code or recovery code" />
      </div>
      <button id="signin">Sign in</button>
      <button id="advToggle" class="link">Server settings</button>
      <div id="adv" hidden>
        <label>Gateway URL</label>
        <input id="server" type="text" placeholder="https://pulse.runstate.mu:8082" />
      </div>
    </div>
    <p class="foot">Pulse Desktop <span id="ver"></span></p>
  </div>

  <!-- Chat -->
  <div id="app" class="app-wrap" hidden>
    <aside class="sidebar">
      <div class="brand small"><span class="logo">P</span><span id="brandName2">Pulse</span></div>
      <div id="channelSection" hidden>
        <div class="agents-label">Departments</div>
        <div id="channelList" class="agent-list"></div>
      </div>
      <div id="agentSection" hidden>
        <div class="agents-label">Direct</div>
        <div id="agentList" class="agent-list"></div>
      </div>
      <div class="spacer"></div>
      <div class="user-row"><span id="userName" class="uname"></span><button id="logout" class="link">Sign out</button></div>
    </aside>
    <main class="chat">
      <header class="chat-head">
        <span id="activeAgent">Select a conversation</span>
        <span id="headSub" class="head-sub"></span>
      </header>
      <div id="messages" class="messages"></div>
      <div id="readonlyBar" class="readonly-bar" hidden>You have read-only access here — you can read but not send messages.</div>
      <form id="composer" class="composer">
        <textarea id="input" rows="1" placeholder="Message… (use @Name to address a specific agent)"></textarea>
        <button id="send" type="submit">Send</button>
      </form>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
